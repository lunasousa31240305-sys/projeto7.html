<!DOCTYPE html>

<html>
    <head>
        <title>Cadastro de Usuário</title>
    </head>

    <body>

        <header id="inicio">
            <h1>7. CADASTRO DE USUÁRIO</h1>

            <nav>
                <a href="#cadastro">Cadastro</a>
                <a href="#informacoes">Informações</a>
            </nav>
        </header>

        <section id="cadastro">
            <h2>Cadastro de Usuário</h2>

            <form>
                <label>
                    Nome:
                    <input id="nome">
                </label><br><br>

                <label>
                    E-mail:
                    <input id="email">
                </label><br><br>

                <label>
                    Senha:
                    <input id="senha">
                </label><br><br>

                <label>
                    Gênero:
                    <select id="genero">
                        <option>Masculino</option>
                        <option>Feminino</option>
                        <option>Outro</option>
                    </select>
                </label><br><br>

                <label>
                    Interesses:
                    <select id="interesses">
                        <option>Esportes</option>
                        <option>Música</option>
                        <option>Viagens</option>
                        <option>Tecnologia</option>
                    </select>
                </label><br><br>

                <label>
                    Biografia:
                    <textarea id="biografia"></textarea>
                </label><br><br>
            </form>
        </section>

        <section id="informacoes">
            <h2>Informações do Usuário</h2>

            <p>Preencha todos os campos para realizar seu cadastro.</p>
        </section>

    </body>
</html>
